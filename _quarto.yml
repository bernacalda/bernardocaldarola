project:
  type: website
  output-dir: _site
  resources:
    - files/
    - images/

website:
  title: "Bernardo Caldarola"
  description: "Applied economist working on structural change, innovation, and economic complexity."
  image: images/headshot-square.jpg
  favicon: images/mark.svg
  open-graph: true
  search: false
  site-url: https://bernacalda.github.io/bernardocaldarola/
  page-navigation: false
  navbar:
    logo: images/mark.svg
    logo-alt: "Home"
    title: "Bernardo Caldarola"
    right:
      - text: Research
        href: research.qmd
      - text: Policy
        href: policy.qmd
      - text: News
        href: news.qmd
      - text: CV
        href: files/cv_BC.pdf
  page-footer:
    left: "© 2026 Bernardo Caldarola. Views expressed here are my own and do not necessarily reflect those of the European Commission."
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [default, assets/theme-light.scss, assets/site.scss]
      dark: [default, assets/theme-dark.scss, assets/site.scss]
    respect-user-color-scheme: true
    include-in-header: assets/fonts.html
    page-layout: article
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    title-block-banner: false
