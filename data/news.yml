# News. The News page shows every item; the "Latest" box on the home page
# shows the three newest.
#
# To add news, copy an entry, paste it at the top and edit it. Items are sorted
# by date, newest first, so the order in this file doesn't matter.
#
# Fields:
#   date:  2026-11-04, or just 2026-11 when the day doesn't matter.
#          Only the month and year are shown. Items dated after the day you
#          render the site are listed under "Upcoming"; once that date has
#          passed, the next render moves them into their year.
#   text:  a sentence or two in Markdown: [link text](https://...), *italics*,
#          **bold**, emojis 🎉. Keep the `>` after `text:` and indent the
#          lines below it: then quotes, colons and apostrophes need no escaping.

