# ---------------------------------------------------------------- Journal articles

- type: article
  title: "Scaling Up to the Cloud: Cloud Technology Use and Growth Rates in Small and Large Firms"
  url: "https://www.sciencedirect.com/science/article/pii/S0048733326002350"
  authors: "with Luca Fontanelli"
  venue: "Research Policy"
  details: "2026"
  themes: [Digital technologies, Firms and innovation]
  abstract: "Using a unique combination of micro-level data sources on French firms, this paper explores the relationship between cloud technologies and firm growth. Whereas digital technologies have generally been found to disproportionately benefit larger firms, we document that cloud use is positively associated with firm growth, and this association is significantly stronger for smaller firms. Distinguishing cloud services between Infrastructure-as-a-Service (IaaS) and Software-as-a-Service (SaaS), we find that the size-contingent association is driven entirely by SaaS. Crucially, this small firm advantage is conditional on complementary assets as it emerges only among firms endowed with ICT capabilities. Our results are robust across a range of specifications, including instrumental variable strategies. SaaS cloud use is further associated with internal workforce reorganisation toward ICT, managerial, and intermediate occupations and away from manual and clerical ones, particularly among smaller firms, consistent with SaaS cloud operating as an organisational innovation enabling digitalisation and scaling. Finally, we present descriptive sectoral evidence of a negative correlation between cloud and market concentration."
  links:
    - {label: Paper, url: "https://www.sciencedirect.com/science/article/pii/S0048733326002350"}
    - {label: Working paper, url: "https://arxiv.org/abs/2409.17035"}

- type: article
  title: "3G Internet Diffusion and Secondary Education Attainment: Evidence of Opportunity Cost in Viet Nam"
  url: "https://onlinelibrary.wiley.com/doi/full/10.1111/rode.70031"
  authors: "with Trang Thi-Pham"
  venue: "Review of Development Economics"
  details: "2026, 30(2), 941–966"
  themes: [Digital technologies, Skills and labour, Structural change]
  abstract: "Mobile internet diffusion has led to significant societal and economic transformations since its early diffusion, especially in the Global South. This has implied changes in human capital formation, particularly through education, and has reshaped the trade-off between education and employment, especially among the younger population. In this paper, we explore the impact of 3G internet diffusion on educational outcomes in Vietnam—a country characterized by sustained industrialization and new employment opportunities. We find that the diffusion of mobile broadband internet improves lower-secondary school attainment but discourages upper-secondary achievement among youngsters. We rationalize these findings through an education—employment trade-off perspective, by considering the opportunity costs of schooling vis à vis employment. We show that the diffusion of fast mobile broadband internet is associated with more job opportunities and reduced returns to schooling during the period 2012–2016. Our results offer implications for developing countries' education and human capital development policies in the age of (mobile) digitalization."
  links:
    - {label: Paper, url: "https://onlinelibrary.wiley.com/doi/full/10.1111/rode.70031"}

- type: article
  title: "Economic Complexity and the Sustainability Transition: A Review of Data, Methods, and Literature"
  url: "https://iopscience.iop.org/article/10.1088/2632-072X/ad4f3d/meta"
  authors: "with Dario Mazzilli, Lorenzo Napolitano, Aurelio Patelli and Angelica Sbardella"
  venue: "Journal of Physics: Complexity"
  details: "2024, 5(2)"
  themes: [Economic complexity, Sustainability]
  abstract: "Economic Complexity (EC) methods have gained increasing popularity across fields and disciplines. In particular, the EC toolbox has proved particularly promising in the study of complex and interrelated phenomena, such as the transition towards a more sustainable economy. Using the EC approach, scholars have been investigating the relationship between EC and sustainability, and identifying the distinguishing characteristics of green activities and to assess the readiness of productive and technological structures for the sustainability transition. This article proposes to review and summarize the data, methods, and empirical literature that are relevant to the study of the sustainability transition from an EC perspective. We review three distinct but connected blocks of literature on EC and environmental sustainability. First, we survey the evidence linking measures of EC to indicators related to environmental sustainability. Second, we review articles that strive to assess the green competitiveness of productive systems. Third, we examine evidence on green technological development and its connection to non-green knowledge bases. Finally, we summarize the findings for each block, while identifying criticalities and avenues for further research in this recent and growing body of empirical literature."
  links:
    - {label: Paper, url: "https://iopscience.iop.org/article/10.1088/2632-072X/ad4f3d/meta"}

- type: article
  title: "Does Teleworking Encourage Longer Commutes? Evidence from the English National Travel Survey"
  url: "https://www.sciencedirect.com/science/article/pii/S2214367X24000851"
  authors: "with Steve Sorrell"
  venue: "Travel Behaviour and Society"
  details: "2024, 37, 100822"
  themes: [Telework and travel]
  abstract: "Teleworking could make an important contribution to reducing car travel, air pollution and carbon emissions. However, a growing body of evidence suggests that teleworkers tend to live further from their place of work than non-teleworkers, and that teleworking encourages more non-work travel. These responses make it difficult to estimate the overall impact of teleworking on personal travel.
This study estimates the impact of teleworking on English travel patterns over the period 2005 to 2019. We focus on whether people choose to telework because they live a long distance from their workplace, or whether they choose to live a long distance from their workplace because they can telework.
We employ a path analysis methodology using data from the English National Travel Survey. We estimate the direct and indirect effects of working from home on the travel patterns of both the teleworker and other members of their household. Our results suggest that teleworking causes people to live farther from their workplace rather than vice versa. We further find that most teleworkers travel farther each week than non-teleworkers and they only achieve travel savings if they work from home for three or more days each week. Our results support the findings of other studies in this area and suggest that public policy needs to target sustainable land-use and transport planning more broadly, rather than encouraging teleworking specifically."
  links:
    - {label: Paper, url: "https://www.sciencedirect.com/science/article/pii/S2214367X24000851"}

- type: article
  title: "Mobile Internet, Skills and Structural Transformation in Rwanda"
  url: "https://www.sciencedirect.com/science/article/pii/S0048733323001555"
  authors: "with Marco Grazzi, Martina Occelli and Marco Sanfilippo"
  venue: "Research Policy"
  details: "2023, 52(10), 104871"
  themes: [Digital technologies, Structural change, Skills and labour]
  abstract: "This paper examines the relationship between mobile internet, employment and structural transformation in Rwanda. Thanks to its ability to enable access to a wide range of ICT technologies, internet coverage has the potential to affect the dynamics and the composition of employment significantly. To demonstrate this, we have combined GSMA network coverage maps with individual-level information from national population censuses and labour force surveys, creating a district-level dataset of Rwanda that covers the 2002 to 2019 period. Our results show that an increase in mobile internet coverage affects the labour market in two ways. First, by increasing employment opportunities. Second, by contributing to changes in the composition of the labour market. Education, migration and shifts in demand are all instrumental in explaining our findings."
  links:
    - {label: Paper, url: "https://www.sciencedirect.com/science/article/pii/S0048733323001555"}
  media:
    - {outlet: "Nemo Kennislink (1)", url: "https://www.nemokennislink.nl/publicaties/afrika-mist-online-aansluiting/"}
    - {outlet: "Nemo Kennislink (2)", url: "https://www.nemokennislink.nl/publicaties/hulp-van-afrikaanse-technici/"}

- type: article
  title: "Do Teleworkers Travel Less? The Historical Impact of Teleworking on English Travel"
  url: "https://www.sciencedirect.com/science/article/abs/pii/S0965856422000738"
  authors: "with Steve Sorrell"
  venue: "Transportation Research Part A: Policy and Practice"
  details: "2022, 159, 282–303"
  themes: [Telework and travel]
  abstract: "The global pandemic has revived debates about the contribution of teleworking to reducing travel, air pollution and carbon emissions. However, previous research suggests that the availability of teleworking may encourage people to move farther from their place of work, creating the risk that longer commutes will offset the benefits of fewer commutes. In addition, teleworking may encourage additional non-work travel by the teleworker, and/or influence the travel behaviour of other household members. These complex interactions make the overall impacts of teleworking difficult to predict.
In this context, we use data from the English National Travel Survey to estimate the impact of teleworking on the travel patterns of English households over the period 2005–2019. We compare the number of trips and distance travelled by teleworkers each week with the number of trips and distance travelled by non-teleworkers, controlling for a range of socio-economic, demographic and regional variables. We estimate the impact of teleworking on travel by purpose (commuting, non-work and business) and by mode (car, public transport and active travel) and investigate the impact on the travel patterns of other household members.
Our results provide little support for the claim that teleworking reduces travel. Indeed, after controlling for a range of variables, we find that the majority of English teleworkers travel farther each week than non-teleworkers. This results from a combination of longer commutes and additional non-work travel. There appears to be a ‘tipping point’, however. If people telework three or more times a week, their weekly private travel (commuting + non-work) is less than that of non-teleworkers. We also find that the total weekly travel of all household members is greater in households where one member is teleworking, suggesting the presence of intra-household effects that further erode the benefits of fewer commutes. We additionally find that teleworkers engage in more business travel than non-teleworkers, although the reasons for this association are unclear. We discuss the factors contributing to these results and indicate priorities for further research."
  links:
    - {label: Paper, url: "https://www.sciencedirect.com/science/article/abs/pii/S0965856422000738"}
  media:
    - {outlet: "Forbes", url: "https://www.forbes.com/sites/adigaskell/2022/07/07/is-hybrid-working-worse-for-the-planet/"}
    - {outlet: "The Telegraph", url: "https://www.telegraph.co.uk/news/2022/04/06/working-home-part-time-bad-environment/"}
    - {outlet: "Daily Mail"}  

# ---------------------------------------------------------------- Working papers

- type: wp
  title: "Structural Change, Employment, and Inequality in Europe: An Economic Complexity Approach"
  url: "https://arxiv.org/abs/2410.07906"
  authors: "with Dario Mazzilli, Aurelio Patelli and Angelica Sbardella"
  venue: "UNU-MERIT Working Paper Series"
  details: "arXiv:2410.07906"
  themes: [Economic complexity, Structural change, Skills and labour]
  abstract: "Structural change consists of industrial diversification towards more productive, knowledge intensive activities. However, changes in the productive structure bear inherent links with job creation and income distribution. In this paper, we investigate the consequences of structural change, defined in terms of labour shifts towards more complex industries, on employment growth, wage inequality, and functional distribution of income. The analysis is conducted for European countries using data on disaggregated industrial employment shares over the period 2010-2018. First, we identify patterns of industrial specialisation by validating a country-industry industrial employment matrix using a bipartite weighted configuration model (BiWCM). Secondly, we introduce a country-level measure of labour-weighted Fitness, which can be decomposed in such a way as to isolate a component that identifies the movement of labour towards more complex industries, which we define as structural change. Thirdly, we link structural change to i) employment growth, ii) wage inequality, and iii) labour share of the economy. The results indicate that our structural change measure is associated negatively with employment growth. However, it is also associated with lower income inequality. As countries move to more complex industries, they drop the least complex ones, so the (low-paid) jobs in the least complex sectors disappear. Finally, structural change predicts a higher labour ratio of the economy; however, this is likely to be due to the increase in salaries rather than by job creation."
  links:
    - {label: arXiv, url: "https://arxiv.org/abs/2410.07906"}
    - {label: Working paper, url: "https://cris.maastrichtuniversity.nl/en/publications/structural-change-employment-and-inequality-in-europe-an-economic/"}

- type: wp
  title: "Mobile Internet Adoption and Inclusive Structural Change: Evidence from Nigerian Non-Farming Enterprises"
  url: "https://steg.cepr.org/publications/mobile-internet-adoption-and-inclusive-structural-change-evidence-nigerian-non-farming"
  authors: "Single-authored"
  venue: "STEG Working Paper"
  themes: [Digital technologies, Structural change, Firms and innovation]
  abstract: "Escaping the middle-income trap requires sustained productivity growth, yet in many lower-middle-income countries the vast majority of non-agricultural employment is concentrated in informal microenterprises. This paper asks whether the adoption of digital technologies can put these firms on an upgrading path. Combining a panel of Nigerian households (2010--2015) with GSMA mobile internet coverage maps, we construct a household-level measure of 3G adoption and identify its effects using geographical variation in lightning strikes alongside an event-study design. Mobile internet adoption raises the sales per worker of non-farming household enterprises (NFEs), showing that digital technologies can improve performance even at the bottom of the firm-size distribution. However, three findings qualify the scope for upgrading: gains are concentrated in low-productivity trade services, and adopting households become less likely to move into manufacturing; adoption does not reduce operating costs and does not induce firm entry, so that benefits accrue to incumbents; and firms shed household labour, which is reabsorbed in wage work outside the household. Digital connectivity thus upgrades informal firms from within, but does not by itself generate the reallocation towards higher-productivity activities, or the entry of new firms, that a transition out of the trap requires."
  links:
    - {label: Working paper, url: "https://steg.cepr.org/publications/mobile-internet-adoption-and-inclusive-structural-change-evidence-nigerian-non-farming"}

- type: wp
  title: "Structural Change(s) in Ghana: A Comparison between the Export, Formal, and Informal Sectors"
  url: "https://www.lem.sssup.it/WPLem/2022-36.html"
  authors: "Single-authored"
  venue: "LEM Papers Series, Sant’Anna School of Advanced Studies"
  themes: [Structural change, Economic complexity]
  abstract: "	
This paper uses the case of Ghana to unpack the role of the informal sector in the process of structural change. A structuralist view of structural change - framed as changes in the employment shares of different industries - is combined with the insight that countries strive to diversify towards more complex industries in pursuit of economic upgrading. The paper adopts and adapts the product space and complexity analytical frameworks to compare changes in the relative importance of industries across the trade, formal and informal sectors, over a ten-year period starting in 2003. To assess whether the Ghanaian labour force has moved towards more or less complex industries, the changes in relative shares of finely disaggregated industries are assessed against an employment-based industrial complexity index. The results indicate that Ghanaâ€™s export and formal sectors have moved towards more complex industries, although export specialisation has moved towards export of natural resources. While exports of manufactured goods have increased, employment in formal and informal manufacturing has contracted, although, in the former case, employment has relocated towards more complex manufacturing industries. In contrast, the informal sector has moved towards less complex activities. The results stress on the need to align the productive capabilities of the informal sector with the Ghana's productive structure in order to allow the participation of Ghanaian households to the process of structural transformation."
  links:
    - {label: Working paper, url: "https://www.lem.sssup.it/WPLem/2022-36.html"}

- type: wp
  title: "Informal and Formal Industrial Co-location and Structural Change in Ghana"
  authors: "with Tommaso Ciarli"
  themes: [Structural change, Regions]
  abstract: "Despite persistently high GDP growth rates, African countries have failed to transform their economies away from subsistence and low-productivity sectors, as labour has moved away from industry to less productive activities. This process, also known as premature de-industrialisation, has led to an increase in the size of the informal sector. While informal economic activities have often been attributed a passive role in the process of structural change, this paper aims to assess the potential contribution of informality to economic transformation by looking at its patterns of co-location and their relatedness, measured in terms of shared capabilities, input-output linkages and complexity differentials. The drivers of informal-formal co-location are analysed using the case of Ghana – a fast growing country where the informal sector employs around a half of the active non-agricultural workforce. Relying on a combination of data sources (the Integrated Business Establishments Survey 2014; the Ghana Labour Force Survey 2015 and the Eora Input-Output Tables of the Ghanaian domestic economy) we build an employment-based measure of informal, formal and informal-formal co-location of all industry pairs, which are explained in terms of their relatedness. The results show that informal activities agglomerate more than formal ones, and that they show a higher degree of relatedness and complementarity when compared to formal ones. However, evidence on informal-formal co-location shows that informal industries tend to be vertically integrated with unrelated formal ones, leaving little room for the flow of labour from informal to formal sectors."

