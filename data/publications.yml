# Publications, working papers and work in progress.
# The Research page reads this file. Entries appear in the order written here.
#
# Fields (only `title` and `type` are required):
#   type:     article | wp | wip         -> which section the entry appears in
#   title:    paper title
#   url:      where the title links to (usually the DOI or the journal page)
#   status:   small label next to the title, e.g. "Forthcoming", "R&R", "Under review"
#   authors:  co-author line
#   venue:    journal or series (shown in italics)
#   details:  year, volume(issue), pages
#   themes:   list of research themes; these become the filter buttons on the page
#   abstract: shown when "Abstract" is clicked; delete the line to hide the button
#   links:    buttons; known labels get icons: Paper, PDF, Working paper, arXiv,
#             Report, Policy brief, Slides, Code, Data, Video
#   media:    press coverage, as outlet + url
#   note:     a small line at the bottom, e.g. funding
#
# TODO: replace every url: "#" with the real link and paste in the abstracts.

